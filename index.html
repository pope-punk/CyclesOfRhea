<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>◈</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Minimal Darkroom Styling, Dynamic Viewport, Safe-Area Insets & Responsive Controls -->
  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #0b0c0c;
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Matte obsidian/charcoal darkroom surface with subtle radial vignette */
    .darkroom-bg {
      background-color: #0b0c0c;
      background-image: radial-gradient(
        ellipse at 50% 48%,
        #141615 0%,
        #0f1110 46%,
        #0b0c0c 100%
      );
    }

    /* Full dynamic viewport container with 100vh fallback */
    .viewport-full {
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    /* Safe-area padding helpers for notched mobile devices and Safari/Chrome bars */
    .safe-shell {
      padding-top: env(safe-area-inset-top, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    .safe-dock {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom, 0px));
    }

    /* Prevent mobile double-tap-to-zoom delay on interactive surfaces */
    .tap-surface,
    button {
      touch-action: manipulation;
    }

    /* Soft tactile gallery shadow behind handout pages */
    .page-shadow {
      box-shadow:
        0 24px 64px rgba(0, 0, 0, 0.88),
        0 8px 22px rgba(0, 0, 0, 0.58);
    }

    /* Show volume range slider on screens >= 480px; keep compact pill on narrow phones */
    .volume-slider-responsive {
      display: none;
    }
    @media (min-width: 480px) {
      .volume-slider-responsive {
        display: block;
      }
    }

    /* Minimal thin volume range slider */
    input[type="range"].minimal-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 2px;
      border-radius: 999px;
      background: rgba(226, 232, 226, 0.22);
      outline: none;
    }

    input[type="range"].minimal-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #dce1dc;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    input[type="range"].minimal-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
      background: #f4f6f4;
    }

    input[type="range"].minimal-slider::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: none;
      border-radius: 999px;
      background: #dce1dc;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    /* Subtle edge chevron highlight when hovering left/right half of the desktop stage */
    .chevron-highlight {
      color: #f4f6f4 !important;
      background-color: rgba(220, 225, 220, 0.085);
      transform: translateY(-50%) scale(1.06);
    }
  </style>
</head>

<body class="darkroom-bg viewport-full overflow-hidden relative">

  <!-- Ultra-Subtle Inline SVG Film Grain Texture (Zero Base64 / Zero External Assets) -->
  <svg
    class="fixed inset-0 w-full h-full pointer-events-none z-50 opacity-[0.04]"
    aria-hidden="true"
  >
    <filter id="darkroom-grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.82"
        numOctaves="3"
        stitchTiles="stitch"
      />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <rect width="100%" height="100%" filter="url(#darkroom-grain)" />
  </svg>

  <!-- Native HTML5 Looping Background Music Element -->
  <audio id="bg-audio" preload="auto" loop playsinline></audio>

  <!-- Native HTML5 Page-Flip SFX Element -->
  <audio id="sfx-pageflip" preload="auto" playsinline></audio>

  <!-- Hidden File Pickers for Local Preview Fallback (Images & Audio) -->
  <input
    id="image-file-input"
    type="file"
    accept="image/*"
    multiple
    class="hidden"
    aria-hidden="true"
  />
  <input
    id="audio-file-input"
    type="file"
    accept="audio/*"
    class="hidden"
    aria-hidden="true"
  />

  <!-- Full-Window Drag-Over Indicator Frame (Zero Text) -->
  <div
    id="drag-overlay"
    class="fixed inset-4 z-50 rounded-2xl border-2 border-dashed border-[#dce1dc]/30 bg-[#0b0c0c]/45 backdrop-blur-[2px] pointer-events-none opacity-0 transition-opacity duration-200 flex items-center justify-center"
    aria-hidden="true"
  >
    <div class="w-16 h-16 rounded-full border border-[#dce1dc]/25 bg-[#0b0c0c]/60 flex items-center justify-center text-[#dce1dc]/80">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0l-4 4m4-4l4 4M4 17v1a2 2 0 002 2h12a2 2 0 002-2v-1" />
      </svg>
    </div>
  </div>

  <!-- =======================================================================
       1. FULL-SCREEN ENTRY OVERLAY (Fades In Music, Primes SFX & Reveals Landing)
  ======================================================================== -->
  <div
    id="entry-overlay"
    class="fixed inset-0 viewport-full z-40 darkroom-bg flex items-center justify-center cursor-pointer transition-opacity duration-700 ease-out tap-surface"
    role="button"
    tabindex="0"
    aria-label="Enter"
  >
    <div
      id="entry-btn"
      class="w-20 h-20 sm:w-24 sm:h-24 rounded-full border border-[#dce1dc]/20 bg-[#dce1dc]/[0.025] flex items-center justify-center text-[#dce1dc]/75 transition-all duration-300 ease-out hover:scale-105 hover:border-[#dce1dc]/45 hover:bg-[#dce1dc]/[0.055] hover:text-[#f4f6f4] hover:shadow-[0_0_40px_rgba(220,225,220,0.1)]"
    >
      <!-- Minimal Play Triangle -->
      <svg class="w-7 h-7 sm:w-8 sm:h-8 translate-x-[2px]" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7.5 5.25L18.75 12L7.5 18.75V5.25Z" />
      </svg>
    </div>
  </div>

  <!-- =======================================================================
       2. MAIN RESPONSIVE FLEX-COLUMN VIEWER (MOBILE & DESKTOP OPTIMIZED)
  ======================================================================== -->
  <main
    id="viewer-shell"
    class="viewport-full safe-shell relative flex flex-col opacity-0 overflow-hidden"
  >
    <!-- Main Viewing Stage: Left Half = Previous, Right Half = Next -->
    <section
      id="stage-area"
      class="flex-1 min-h-0 relative w-full flex items-center justify-center px-2 pt-2 pb-1 sm:px-16 sm:pt-5 sm:pb-2 tap-surface"
      aria-label="Document stage"
    >
      <!-- Desktop Floating Left Edge Chevron -->
      <button
        id="prev-btn"
        type="button"
        class="hidden sm:flex absolute left-3 md:left-5 top-1/2 -translate-y-1/2 z-20 w-11 h-11 md:w-12 md:h-12 rounded-full items-center justify-center text-[#dce1dc]/50 hover:text-[#f4f6f4] hover:bg-[#dce1dc]/[0.085] disabled:opacity-15 disabled:hover:bg-transparent disabled:hover:text-[#dce1dc]/50 disabled:cursor-default transition-all duration-200 cursor-pointer focus:outline-none"
        aria-label="Previous"
      >
        <svg class="w-6 h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.25 19L8.25 12L15.25 5" />
        </svg>
      </button>

      <!-- Desktop Floating Right Edge Chevron -->
      <button
        id="next-btn"
        type="button"
        class="hidden sm:flex absolute right-3 md:right-5 top-1/2 -translate-y-1/2 z-20 w-11 h-11 md:w-12 md:h-12 rounded-full items-center justify-center text-[#dce1dc]/50 hover:text-[#f4f6f4] hover:bg-[#dce1dc]/[0.085] disabled:opacity-15 disabled:hover:bg-transparent disabled:hover:text-[#dce1dc]/50 disabled:cursor-default transition-all duration-200 cursor-pointer focus:outline-none"
        aria-label="Next"
      >
        <svg class="w-6 h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.75 5L15.75 12L8.75 19" />
        </svg>
      </button>

      <!-- Center Stage Container: Fades & Scales Up on Landing Reveal, Crisp Fades Between Pages -->
      <div
        id="stage-container"
        class="w-full h-full flex items-center justify-center opacity-0 scale-[0.985] will-change-[opacity,transform]"
      >
        <!-- Active Handout Image (Maximizes Stage Space Without Ever Overlapping Bottom Dock) -->
        <img
          id="page-img"
          src=""
          alt=""
          draggable="false"
          class="hidden page-shadow max-h-full max-w-full w-auto h-auto object-contain rounded-[3px] select-none pointer-events-none"
        />

        <!-- Icon-Only Missing-Image Fallback Upload Frame -->
        <button
          id="fallback-upload"
          type="button"
          class="hidden w-52 h-68 sm:w-64 sm:h-80 rounded-2xl border border-dashed border-[#dce1dc]/20 hover:border-[#dce1dc]/45 bg-[#dce1dc]/[0.02] hover:bg-[#dce1dc]/[0.045] flex items-center justify-center text-[#dce1dc]/45 hover:text-[#f4f6f4]/90 transition-all duration-200 cursor-pointer focus:outline-none"
          aria-label="Load images"
        >
          <svg class="w-11 h-11" fill="none" stroke="currentColor" stroke-width="1.35" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h7" />
            <circle cx="8.5" cy="9.5" r="1.25" fill="currentColor" stroke="none" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.5 16.5l4.2-4.2a1.2 1.2 0 011.7 0l2.6 2.6" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.5 14v6M14.5 17h6" />
          </svg>
        </button>
      </div>
    </section>

    <!-- =====================================================================
         3. BOTTOM DOCK (MOBILE INLINE NAV + DOTS + AUDIO / DESKTOP CENTERED DOTS + SUBTLE AUDIO PILL)
    ====================================================================== -->
    <footer
      id="bottom-dock"
      class="shrink-0 w-full relative z-20 safe-dock pt-1.5 px-3 sm:px-5 flex items-center justify-between sm:justify-end gap-2"
    >
      <!-- Mobile Inline Nav + Pagination Dots (Centered on Desktop via Absolute Positioning) -->
      <div
        class="flex items-center gap-0.5 sm:gap-1 sm:absolute sm:left-1/2 sm:-translate-x-1/2"
      >
        <!-- Compact Mobile Previous Chevron -->
        <button
          id="mobile-prev-btn"
          type="button"
          class="sm:hidden w-9 h-9 rounded-full flex items-center justify-center text-[#dce1dc]/65 active:bg-[#dce1dc]/10 disabled:opacity-20 disabled:active:bg-transparent transition-colors focus:outline-none"
          aria-label="Previous"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.65" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.25 19L8.25 12L15.25 5" />
          </svg>
        </button>

        <!-- Minimal Pagination Dots -->
        <nav
          id="pagination-dots"
          class="flex items-center gap-0.5 sm:gap-1 px-0.5 sm:px-2 py-1"
          aria-label="Pages"
        >
          <!-- Dots generated via JS -->
        </nav>

        <!-- Compact Mobile Next Chevron -->
        <button
          id="mobile-next-btn"
          type="button"
          class="sm:hidden w-9 h-9 rounded-full flex items-center justify-center text-[#dce1dc]/65 active:bg-[#dce1dc]/10 disabled:opacity-20 disabled:active:bg-transparent transition-colors focus:outline-none"
          aria-label="Next"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.65" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.75 5L15.75 12L8.75 19" />
          </svg>
        </button>
      </div>

      <!-- Minimal Icon-Only Audio Pill -->
      <div
        id="audio-pill"
        class="shrink-0 flex items-center gap-1 sm:gap-1.5 px-2 sm:px-2.5 py-1 sm:py-1.5 rounded-full bg-[#111312]/80 border border-[#dce1dc]/12 backdrop-blur-md opacity-80 sm:opacity-40 sm:hover:opacity-100 focus-within:opacity-100 transition-opacity duration-300"
      >
        <!-- Play / Pause SVG Toggle -->
        <button
          id="audio-play-btn"
          type="button"
          class="w-8 h-8 rounded-full flex items-center justify-center text-[#dce1dc]/80 hover:text-[#f4f6f4] hover:bg-[#dce1dc]/10 transition-colors cursor-pointer focus:outline-none"
          aria-label="Play or pause"
        >
          <svg id="icon-play" class="w-3.5 h-3.5 translate-x-[0.5px]" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.5 5.25L18.75 12L7.5 18.75V5.25Z" />
          </svg>
          <svg id="icon-pause" class="w-3.5 h-3.5 hidden" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.75 5.25H10.25V18.75H6.75V5.25ZM13.75 5.25H17.25V18.75H13.75V5.25Z" />
          </svg>
        </button>

        <!-- Mute / Unmute SVG Toggle -->
        <button
          id="audio-mute-btn"
          type="button"
          class="w-8 h-8 rounded-full flex items-center justify-center text-[#dce1dc]/80 hover:text-[#f4f6f4] hover:bg-[#dce1dc]/10 transition-colors cursor-pointer focus:outline-none"
          aria-label="Mute or unmute"
        >
          <svg id="icon-vol-on" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.65" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5.5L6.5 9H3.5V15H6.5L11 18.5V5.5Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.2 8.8a4.5 4.5 0 010 6.4" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M18.2 6a8.5 8.5 0 010 12" />
          </svg>
          <svg id="icon-vol-off" class="w-4 h-4 hidden text-[#dce1dc]/45" fill="none" stroke="currentColor" stroke-width="1.65" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5.5L6.5 9H3.5V15H6.5L11 18.5V5.5Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 9.5L21 14.5M21 9.5L16 14.5" />
          </svg>
        </button>

        <!-- Minimal Volume Slider (Hidden on Narrow Phones < 480px) -->
        <input
          id="audio-volume"
          type="range"
          min="0"
          max="100"
          value="45"
          class="minimal-slider volume-slider-responsive w-14 sm:w-16 mx-0.5 cursor-pointer"
          aria-label="Volume"
        />

        <!-- Local Audio Upload Fallback Icon (Revealed ONLY if place.mp3 Fails to Load) -->
        <button
          id="audio-upload-btn"
          type="button"
          class="hidden w-8 h-8 rounded-full items-center justify-center text-[#dce1dc]/70 hover:text-[#f4f6f4] hover:bg-[#dce1dc]/10 transition-colors cursor-pointer focus:outline-none"
          aria-label="Load audio file"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.5a2 2 0 11-4 0 2 2 0 014 0zm0 0V6.5l10-2v8.5" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.5 15v5M15 17.5h5" />
          </svg>
        </button>
      </div>
    </footer>
  </main>

  <!-- =======================================================================
       APPLICATION LOGIC
  ======================================================================== -->
  <script>
    /* -----------------------------------------------------------------------
     * PAGES & AUDIO CONFIGURATION
     * ----------------------------------------------------------------------- */
    const PAGES = [
      'LandingPage.png',
      'Refresher1.png',
      'Refresher2.png',
      'Refresher3.png',
      'Refresher4.png',
      'Refresher5.png',
      'Refresher6.png',
    ];

    const AUDIO_SRC = 'place.mp3';
    const PAGEFLIP_SRCS = ['page-flip-02.mp3', 'pageflip.mp3'];

    const DEFAULT_VOLUME = 0.45;
    const FADE_IN_MS = 1200;
    const LANDING_FADE_UP_MS = 1800;
    const PAGE_TRANSITION_MS = 260;

    /* -----------------------------------------------------------------------
     * APPLICATION STATE
     * ----------------------------------------------------------------------- */
    const state = {
      entered: false,
      landingFading: false,
      landingRevealStarted: false,
      landingFadeTimer: null,
      pageSwapTimer: null,

      sources: [...PAGES],
      currentIndex: 0,
      imageLoaded: false,
      imageObjectUrls: [],

      // Background Music State
      audioObjectUrl: null,
      targetVolume: DEFAULT_VOLUME,
      isMuted: false,
      audioPlaying: false,
      audioError: false,
      userPaused: false,
      fadeRafId: null,
      unlockArmed: false,

      // Page-Flip SFX State
      sfxSrcIndex: 0,
      sfxObjectUrl: null,
      sfxUsingLocal: false,
      sfxUnavailable: false,
      sfxPrimed: false,

      // Pointer / Touch State
      hoverSide: null, // 'left' | 'right' | null
      suppressStageClickUntil: 0,
    };

    /* -----------------------------------------------------------------------
     * DOM REFERENCES
     * ----------------------------------------------------------------------- */
    const dom = {
      audio: document.getElementById('bg-audio'),
      sfxPageFlip: document.getElementById('sfx-pageflip'),
      entryOverlay: document.getElementById('entry-overlay'),
      viewerShell: document.getElementById('viewer-shell'),
      stageArea: document.getElementById('stage-area'),
      stageContainer: document.getElementById('stage-container'),
      pageImg: document.getElementById('page-img'),
      fallbackUpload: document.getElementById('fallback-upload'),
      imageFileInput: document.getElementById('image-file-input'),
      audioFileInput: document.getElementById('audio-file-input'),
      dragOverlay: document.getElementById('drag-overlay'),

      prevBtn: document.getElementById('prev-btn'),
      nextBtn: document.getElementById('next-btn'),
      mobilePrevBtn: document.getElementById('mobile-prev-btn'),
      mobileNextBtn: document.getElementById('mobile-next-btn'),
      paginationDots: document.getElementById('pagination-dots'),

      audioPlayBtn: document.getElementById('audio-play-btn'),
      iconPlay: document.getElementById('icon-play'),
      iconPause: document.getElementById('icon-pause'),
      audioMuteBtn: document.getElementById('audio-mute-btn'),
      iconVolOn: document.getElementById('icon-vol-on'),
      iconVolOff: document.getElementById('icon-vol-off'),
      audioVolume: document.getElementById('audio-volume'),
      audioUploadBtn: document.getElementById('audio-upload-btn'),
    };

    /* -----------------------------------------------------------------------
     * AUDIO ENGINE: BACKGROUND MUSIC (place.mp3) & PAGE-FLIP SFX
     * ----------------------------------------------------------------------- */

    /**
     * Computes quiet, natural page-flip volume relative to current music target volume.
     * Returns 0 when muted or music volume is 0; otherwise gently clamped between 0.08 and 0.42.
     */
    function computeSfxVolume() {
      if (state.isMuted || state.targetVolume <= 0.001) return 0;
      const scaled = state.targetVolume * 0.4;
      return Math.max(0.08, Math.min(0.42, scaled));
    }

    function syncAudioIcons() {
      dom.iconPlay.classList.toggle('hidden', state.audioPlaying);
      dom.iconPause.classList.toggle('hidden', !state.audioPlaying);

      const mutedNow = state.isMuted || state.targetVolume <= 0.001;
      dom.iconVolOn.classList.toggle('hidden', mutedNow);
      dom.iconVolOff.classList.toggle('hidden', !mutedNow);
    }

    function setAudioUploadVisible(visible) {
      dom.audioUploadBtn.classList.toggle('hidden', !visible);
      dom.audioUploadBtn.classList.toggle('flex', visible);
    }

    function cancelFade() {
      if (state.fadeRafId !== null) {
        cancelAnimationFrame(state.fadeRafId);
        state.fadeRafId = null;
      }
    }

    function fadeAudioVolume(fromVol, toVol, durationMs = FADE_IN_MS) {
      cancelFade();
      const startTime = performance.now();
      const safeFrom = Math.max(0, Math.min(1, fromVol));
      const safeTo = Math.max(0, Math.min(1, toVol));

      dom.audio.volume = safeFrom;

      function tick(now) {
        if (dom.audio.paused || state.isMuted) {
          state.fadeRafId = null;
          return;
        }
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / durationMs);
        // Smooth cubic ease-out curve
        const eased = 1 - Math.pow(1 - t, 3);
        dom.audio.volume = Math.max(0, Math.min(1, safeFrom + (safeTo - safeFrom) * eased));

        if (t < 1) {
          state.fadeRafId = requestAnimationFrame(tick);
        } else {
          state.fadeRafId = null;
        }
      }

      state.fadeRafId = requestAnimationFrame(tick);
    }

    /**
     * Silently primes/unlocks the page-flip <audio> element inside a direct user gesture
     * so mobile Safari/iOS and desktop browsers permit instant playback on any later event.
     */
    function primePageFlipSfx() {
      if (state.sfxPrimed || state.sfxUnavailable) return;
      const sfx = dom.sfxPageFlip;
      if (!sfx || !sfx.src) return;

      try {
        sfx.muted = true;
        sfx.volume = 0;
        const p = sfx.play();
        if (p && typeof p.then === 'function') {
          p.then(() => {
            sfx.pause();
            try {
              sfx.currentTime = 0;
            } catch (_) {
              // Ignore seek errors if metadata not yet loaded
            }
            sfx.muted = state.isMuted;
            sfx.volume = computeSfxVolume();
            state.sfxPrimed = true;
          }).catch(() => {
            sfx.muted = state.isMuted;
            sfx.volume = computeSfxVolume();
          });
        } else {
          sfx.pause();
          sfx.muted = state.isMuted;
          sfx.volume = computeSfxVolume();
          state.sfxPrimed = true;
        }
      } catch (_) {
        sfx.muted = state.isMuted;
        sfx.volume = computeSfxVolume();
      }
    }

    /**
     * Plays the page-flip sound cleanly on any actual page transition, supporting rapid clicks/taps.
     */
    function playPageFlipSfx() {
      if (state.sfxUnavailable) return;
      const vol = computeSfxVolume();
      if (vol <= 0) return;

      const sfx = dom.sfxPageFlip;
      if (!sfx || !sfx.src) return;

      try {
        sfx.pause();
        sfx.muted = false;
        sfx.volume = vol;
        try {
          sfx.currentTime = 0;
        } catch (_) {
          // Ignore seek error if stream is still initializing
        }
        const p = sfx.play();
        if (p && typeof p.then === 'function') {
          p.then(() => {
            state.sfxPrimed = true;
          }).catch(() => {
            // Silently ignore transient playback blocks
          });
        }
      } catch (_) {
        // Silently ignore SFX errors
      }
    }

    /**
     * One-time gesture fallback if background music autoplay was initially blocked.
     */
    function armAutoplayUnlock() {
      if (state.unlockArmed) return;
      state.unlockArmed = true;

      const unlockHandler = () => {
        window.removeEventListener('pointerdown', unlockHandler, true);
        window.removeEventListener('keydown', unlockHandler, true);
        state.unlockArmed = false;

        if (!state.userPaused && !state.audioError && dom.audio.paused) {
          startAudio(true);
        }
      };

      window.addEventListener('pointerdown', unlockHandler, true);
      window.addEventListener('keydown', unlockHandler, true);
    }

    function startAudio(withFade = true) {
      state.userPaused = false;
      dom.audio.muted = state.isMuted;

      const startVol = withFade && !state.isMuted ? 0 : (state.isMuted ? 0 : state.targetVolume);
      if (dom.audio.paused) {
        dom.audio.volume = startVol;
      }

      try {
        const playPromise = dom.audio.play();
        if (playPromise && typeof playPromise.then === 'function') {
          playPromise
            .then(() => {
              state.audioError = false;
              state.audioPlaying = true;
              setAudioUploadVisible(false);
              syncAudioIcons();

              if (withFade && !state.isMuted) {
                fadeAudioVolume(dom.audio.volume, state.targetVolume, FADE_IN_MS);
              } else if (!state.isMuted) {
                cancelFade();
                dom.audio.volume = state.targetVolume;
              }
            })
            .catch((err) => {
              state.audioPlaying = false;
              syncAudioIcons();

              if (err && err.name === 'NotAllowedError') {
                armAutoplayUnlock();
              } else if (err && err.name === 'NotSupportedError') {
                state.audioError = true;
                setAudioUploadVisible(true);
              }
            });
        }
      } catch (_) {
        state.audioError = true;
        setAudioUploadVisible(true);
      }
    }

    function toggleAudioPlay() {
      if (state.audioError) {
        dom.audioFileInput.click();
        return;
      }

      if (dom.audio.paused) {
        startAudio(false);
      } else {
        state.userPaused = true;
        cancelFade();
        dom.audio.pause();
        state.audioPlaying = false;
        syncAudioIcons();
      }
    }

    function toggleAudioMute() {
      cancelFade();
      state.isMuted = !state.isMuted;
      dom.audio.muted = state.isMuted;
      dom.sfxPageFlip.muted = state.isMuted;

      if (!state.isMuted) {
        if (state.targetVolume <= 0.001) {
          state.targetVolume = DEFAULT_VOLUME;
          dom.audioVolume.value = String(Math.round(DEFAULT_VOLUME * 100));
        }
        dom.audio.volume = state.targetVolume;
      }

      dom.sfxPageFlip.volume = computeSfxVolume();
      syncAudioIcons();
    }

    function handleVolumeInput(rawValue) {
      cancelFade();
      const clamped = Math.max(0, Math.min(100, Number(rawValue) || 0));
      state.targetVolume = clamped / 100;

      if (clamped > 0 && state.isMuted) {
        state.isMuted = false;
        dom.audio.muted = false;
        dom.sfxPageFlip.muted = false;
      }

      dom.audio.volume = state.targetVolume;
      dom.sfxPageFlip.volume = computeSfxVolume();
      syncAudioIcons();
    }

    function loadLocalSfxFile(file) {
      if (!file) return;
      try {
        if (state.sfxObjectUrl) {
          URL.revokeObjectURL(state.sfxObjectUrl);
        }
        state.sfxObjectUrl = URL.createObjectURL(file);
        state.sfxUsingLocal = true;
        state.sfxUnavailable = false;
        state.sfxPrimed = false;

        dom.sfxPageFlip.src = state.sfxObjectUrl;
        dom.sfxPageFlip.volume = computeSfxVolume();
        dom.sfxPageFlip.load();
      } catch (_) {
        // Silently ignore local SFX load errors
      }
    }

    function loadLocalAudioFile(file) {
      if (!file) return;
      try {
        if (state.audioObjectUrl) {
          URL.revokeObjectURL(state.audioObjectUrl);
        }
        state.audioObjectUrl = URL.createObjectURL(file);
        state.audioError = false;
        setAudioUploadVisible(false);

        dom.audio.src = state.audioObjectUrl;
        dom.audio.loop = true;
        dom.audio.load();
        startAudio(true);
      } catch (_) {
        state.audioError = true;
        setAudioUploadVisible(true);
      }
    }

    function initAudio() {
      // Configure background music
      dom.audio.src = AUDIO_SRC;
      dom.audio.loop = true;
      dom.audio.preload = 'auto';
      dom.audio.volume = 0;
      dom.audioVolume.value = String(Math.round(state.targetVolume * 100));

      // Configure page-flip SFX with automatic fallback from PAGEFLIP_SRCS[0] -> PAGEFLIP_SRCS[1]
      state.sfxSrcIndex = 0;
      state.sfxUsingLocal = false;
      state.sfxUnavailable = false;
      dom.sfxPageFlip.preload = 'auto';
      dom.sfxPageFlip.volume = computeSfxVolume();

      dom.sfxPageFlip.addEventListener('canplay', () => {
        state.sfxUnavailable = false;
      });

      dom.sfxPageFlip.addEventListener('error', () => {
        if (!state.sfxUsingLocal && state.sfxSrcIndex + 1 < PAGEFLIP_SRCS.length) {
          state.sfxSrcIndex += 1;
          state.sfxPrimed = false;
          dom.sfxPageFlip.src = PAGEFLIP_SRCS[state.sfxSrcIndex];
          dom.sfxPageFlip.load();
        } else {
          state.sfxUnavailable = true;
        }
      });

      if (PAGEFLIP_SRCS.length > 0) {
        dom.sfxPageFlip.src = PAGEFLIP_SRCS[0];
        dom.sfxPageFlip.load();
      }

      // Background music events
      dom.audio.addEventListener('play', () => {
        state.audioPlaying = true;
        syncAudioIcons();
      });

      dom.audio.addEventListener('pause', () => {
        state.audioPlaying = false;
        syncAudioIcons();
      });

      // Seamless loop safeguard in addition to loop attribute
      dom.audio.addEventListener('ended', () => {
        try {
          dom.audio.currentTime = 0;
          dom.audio.play().catch(() => {});
        } catch (_) {
          // Ignore transient loop error
        }
      });

      dom.audio.addEventListener('canplay', () => {
        state.audioError = false;
        setAudioUploadVisible(false);
      });

      // Show local audio upload button ONLY if place.mp3 fails to load
      dom.audio.addEventListener('error', () => {
        state.audioError = true;
        state.audioPlaying = false;
        cancelFade();
        setAudioUploadVisible(true);
        syncAudioIcons();
      });

      syncAudioIcons();
    }

    /* -----------------------------------------------------------------------
     * STAGE HOVER FEEDBACK & NAVIGATION STATE
     * ----------------------------------------------------------------------- */
    function updateNavButtonsAndCursor() {
      const atFirst = state.currentIndex <= 0;
      const atLast = state.currentIndex >= state.sources.length - 1;

      dom.prevBtn.disabled = atFirst;
      dom.nextBtn.disabled = atLast;
      dom.mobilePrevBtn.disabled = atFirst;
      dom.mobileNextBtn.disabled = atLast;

      // Apply subtle desktop edge chevron highlight & pointer cursor only when transition is possible
      const highlightLeft = state.hoverSide === 'left' && !atFirst;
      const highlightRight = state.hoverSide === 'right' && !atLast;

      dom.prevBtn.classList.toggle('chevron-highlight', highlightLeft);
      dom.nextBtn.classList.toggle('chevron-highlight', highlightRight);

      if (highlightLeft || highlightRight) {
        dom.stageArea.style.cursor = 'pointer';
      } else {
        dom.stageArea.style.cursor = 'default';
      }
    }

    function clearStageHover() {
      state.hoverSide = null;
      updateNavButtonsAndCursor();
    }

    /* -----------------------------------------------------------------------
     * DOSSIER PAGE RENDERING & TRANSITIONS
     * ----------------------------------------------------------------------- */
    function finishLandingFade() {
      if (state.landingFadeTimer !== null) {
        clearTimeout(state.landingFadeTimer);
        state.landingFadeTimer = null;
      }
      state.landingFading = false;
      dom.stageContainer.classList.remove('scale-[0.985]');
      dom.stageContainer.style.transition = `opacity ${PAGE_TRANSITION_MS}ms ease-out`;
      dom.viewerShell.style.transition = `opacity ${PAGE_TRANSITION_MS}ms ease-out`;
    }

    function triggerLandingStageReveal() {
      if (state.landingRevealStarted) return;
      state.landingRevealStarted = true;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          dom.stageContainer.classList.remove('opacity-0', 'scale-[0.985]');
        });
      });
      state.landingFadeTimer = setTimeout(() => {
        finishLandingFade();
      }, LANDING_FADE_UP_MS + 60);
    }

    function renderPaginationDots() {
      dom.paginationDots.innerHTML = '';
      if (state.sources.length <= 1) return;

      state.sources.forEach((_, idx) => {
        const active = idx === state.currentIndex;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-label', `Page ${idx + 1}`);
        btn.className = 'p-1.5 flex items-center justify-center cursor-pointer focus:outline-none group';

        const dot = document.createElement('span');
        dot.className = active
          ? 'block w-4 h-1.5 rounded-full bg-[#e6ebe6]/85 transition-all duration-200'
          : 'block w-1.5 h-1.5 rounded-full bg-[#dce1dc]/25 group-hover:bg-[#dce1dc]/55 transition-all duration-200';

        btn.appendChild(dot);
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          goToPage(idx);
        });
        dom.paginationDots.appendChild(btn);
      });
    }

    function preloadNeighbors() {
      [state.currentIndex - 1, state.currentIndex + 1].forEach((idx) => {
        if (idx >= 0 && idx < state.sources.length) {
          const pre = new Image();
          pre.src = state.sources[idx];
        }
      });
    }

    function showPage(index, immediate = false) {
      if (index < 0 || index >= state.sources.length) return;
      if (state.pageSwapTimer !== null) {
        clearTimeout(state.pageSwapTimer);
        state.pageSwapTimer = null;
      }

      state.currentIndex = index;
      updateNavButtonsAndCursor();
      renderPaginationDots();

      const loadTarget = () => {
        state.imageLoaded = false;
        const src = state.sources[index];

        // Hide both elements until load/error resolves so no broken image icon ever flashes
        dom.pageImg.classList.add('hidden');
        dom.fallbackUpload.classList.add('hidden');

        dom.pageImg.onload = () => {
          if (state.sources[state.currentIndex] !== src) return;
          state.imageLoaded = true;
          dom.fallbackUpload.classList.add('hidden');
          dom.pageImg.classList.remove('hidden');

          if (!state.entered) {
            preloadNeighbors();
            return;
          }

          if (state.landingFading) {
            triggerLandingStageReveal();
          } else {
            dom.stageContainer.classList.remove('opacity-0');
          }
          preloadNeighbors();
        };

        dom.pageImg.onerror = () => {
          if (state.sources[state.currentIndex] !== src) return;
          state.imageLoaded = false;
          dom.pageImg.classList.add('hidden');
          dom.pageImg.removeAttribute('src');
          dom.fallbackUpload.classList.remove('hidden');

          if (!state.entered) return;

          if (state.landingFading) {
            triggerLandingStageReveal();
          } else {
            dom.stageContainer.classList.remove('opacity-0');
          }
        };

        dom.pageImg.src = src;
      };

      if (immediate) {
        loadTarget();
      } else {
        dom.stageContainer.classList.add('opacity-0');
        state.pageSwapTimer = setTimeout(() => {
          state.pageSwapTimer = null;
          loadTarget();
        }, 150);
      }
    }

    /**
     * Navigates to a target page and plays the page-flip SFX on EVERY valid transition.
     * Never fires SFX when out of bounds or already on that page.
     */
    function goToPage(index) {
      if (index === state.currentIndex || index < 0 || index >= state.sources.length) {
        return;
      }

      playPageFlipSfx();

      if (state.landingFading) {
        finishLandingFade();
      }

      showPage(index, false);
    }

    /* -----------------------------------------------------------------------
     * LOCAL PREVIEW FALLBACK & WINDOW DRAG-AND-DROP (IMAGES + AUDIO)
     * ----------------------------------------------------------------------- */
    function isImageFile(file) {
      return (
        (file.type && file.type.startsWith('image/')) ||
        /\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(file.name || '')
      );
    }

    function isAudioFile(file) {
      return (
        (file.type && file.type.startsWith('audio/')) ||
        /\.(mp3|wav|ogg|m4a|flac|aac|webm)$/i.test(file.name || '')
      );
    }

    function loadLocalImageFiles(files) {
      try {
        const images = Array.from(files || []).filter(isImageFile);
        if (images.length === 0) return false;

        // Sort LandingPage.png (any filename containing 'landing') first, then natural alphanumeric order
        images.sort((a, b) => {
          const aLanding = /landing/i.test(a.name || '');
          const bLanding = /landing/i.test(b.name || '');
          if (aLanding && !bLanding) return -1;
          if (!aLanding && bLanding) return 1;
          return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
        });

        state.imageObjectUrls.forEach((url) => URL.revokeObjectURL(url));
        state.imageObjectUrls = [];

        state.sources = images.map((file) => {
          const url = URL.createObjectURL(file);
          state.imageObjectUrls.push(url);
          return url;
        });

        showPage(0, !state.entered);
        return true;
      } catch (_) {
        return false;
      }
    }

    function handleDroppedFiles(fileList) {
      const files = Array.from(fileList || []);
      if (files.length === 0) return;

      const audioFiles = files.filter(isAudioFile);
      const imageFiles = files.filter(isImageFile);

      // Audio file containing 'flip' in filename -> page-flip SFX; others -> background music
      const sfxFiles = audioFiles.filter((file) => /flip/i.test(file.name || ''));
      const bgFiles = audioFiles.filter((file) => !/flip/i.test(file.name || ''));

      if (sfxFiles.length > 0) {
        loadLocalSfxFile(sfxFiles[0]);
      }

      if (bgFiles.length > 0) {
        loadLocalAudioFile(bgFiles[0]);
      }

      if (imageFiles.length > 0) {
        loadLocalImageFiles(imageFiles);
      }

      // If files were dropped directly onto the entry overlay, smoothly enter the viewer
      if (!state.entered && (imageFiles.length > 0 || bgFiles.length > 0 || sfxFiles.length > 0)) {
        enterViewer(bgFiles.length === 0);
      }
    }

    function initWindowDragDrop() {
      let dragDepth = 0;

      window.addEventListener('dragenter', (e) => {
        if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
        e.preventDefault();
        dragDepth++;
        dom.dragOverlay.classList.remove('opacity-0');
      });

      window.addEventListener('dragover', (e) => {
        if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
        e.preventDefault();
      });

      window.addEventListener('dragleave', (e) => {
        if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
        e.preventDefault();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) {
          dom.dragOverlay.classList.add('opacity-0');
        }
      });

      window.addEventListener('drop', (e) => {
        if (!e.dataTransfer || !e.dataTransfer.files || e.dataTransfer.files.length === 0) return;
        e.preventDefault();
        dragDepth = 0;
        dom.dragOverlay.classList.add('opacity-0');
        handleDroppedFiles(e.dataTransfer.files);
      });
    }

    /* -----------------------------------------------------------------------
     * ENTRY TRIGGER & GLOBAL INPUT BINDINGS
     * ----------------------------------------------------------------------- */
    function enterViewer(triggerAudio = true) {
      if (state.entered) return;
      state.entered = true;
      state.landingFading = true;
      state.landingRevealStarted = false;

      // Prime page-flip SFX inside this direct user gesture so iOS/Safari unlocks it immediately
      primePageFlipSfx();

      if (triggerAudio && !state.audioError) {
        if (dom.audio.paused) {
          startAudio(true);
        } else if (!state.isMuted) {
          fadeAudioVolume(dom.audio.volume, state.targetVolume, FADE_IN_MS);
        }
      }

      // Slow, atmospheric 1.8s fade-up and subtle scale for LandingPage.png
      dom.viewerShell.style.transition = `opacity ${LANDING_FADE_UP_MS}ms ease-out`;
      dom.stageContainer.style.transition = `opacity ${LANDING_FADE_UP_MS}ms ease-out, transform ${LANDING_FADE_UP_MS}ms ease-out`;

      dom.entryOverlay.classList.add('opacity-0', 'pointer-events-none');

      requestAnimationFrame(() => {
        dom.viewerShell.classList.remove('opacity-0');
        if (state.imageLoaded || !dom.fallbackUpload.classList.contains('hidden')) {
          triggerLandingStageReveal();
        }
      });

      setTimeout(() => {
        dom.entryOverlay.classList.add('hidden');
      }, 720);
    }

    function bindEvents() {
      // Entry overlay click / keyboard trigger
      dom.entryOverlay.addEventListener('click', () => enterViewer(true));
      dom.entryOverlay.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          enterViewer(true);
        }
      });

      // Desktop & mobile chevron buttons (stopPropagation prevents double-trigger with stage click)
      dom.prevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        goToPage(state.currentIndex - 1);
      });
      dom.nextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        goToPage(state.currentIndex + 1);
      });
      dom.mobilePrevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        goToPage(state.currentIndex - 1);
      });
      dom.mobileNextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        goToPage(state.currentIndex + 1);
      });

      // Left/Right half stage tap & click navigation (excluding interactive controls)
      dom.stageArea.addEventListener('click', (e) => {
        if (!state.entered) return;
        if (performance.now() < state.suppressStageClickUntil) return;
        if (e.target.closest('button, input, #audio-pill, #pagination-dots')) return;

        const rect = dom.stageArea.getBoundingClientRect();
        const isLeftHalf = e.clientX < rect.left + rect.width / 2;

        if (isLeftHalf) {
          goToPage(state.currentIndex - 1);
        } else {
          goToPage(state.currentIndex + 1);
        }
      });

      // Subtle desktop hover feedback over left/right halves of the stage
      dom.stageArea.addEventListener('pointermove', (e) => {
        if (e.pointerType !== 'mouse' || !state.entered) return;
        if (e.target.closest('#fallback-upload')) {
          clearStageHover();
          return;
        }
        const rect = dom.stageArea.getBoundingClientRect();
        const side = e.clientX < rect.left + rect.width / 2 ? 'left' : 'right';
        if (state.hoverSide !== side) {
          state.hoverSide = side;
          updateNavButtonsAndCursor();
        }
      });

      dom.stageArea.addEventListener('pointerleave', (e) => {
        if (e.pointerType !== 'mouse') return;
        clearStageHover();
      });

      // Horizontal touch swipe on the viewing stage (suppresses trailing synthetic click)
      let swipeStartX = 0;
      let swipeStartY = 0;
      let swipeTracking = false;

      dom.stageArea.addEventListener('touchstart', (e) => {
        if (!state.entered || e.touches.length !== 1) return;
        if (e.target.closest('button, input')) return;
        swipeTracking = true;
        swipeStartX = e.touches[0].clientX;
        swipeStartY = e.touches[0].clientY;
      }, { passive: true });

      dom.stageArea.addEventListener('touchend', (e) => {
        if (!swipeTracking || e.changedTouches.length !== 1) return;
        swipeTracking = false;

        const dx = e.changedTouches[0].clientX - swipeStartX;
        const dy = e.changedTouches[0].clientY - swipeStartY;

        if (Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy) * 1.35) {
          // Prevent any synthetic tap/click from double-firing after swipe
          state.suppressStageClickUntil = performance.now() + 450;
          if (dx < 0) {
            goToPage(state.currentIndex + 1);
          } else {
            goToPage(state.currentIndex - 1);
          }
        }
      }, { passive: true });

      dom.stageArea.addEventListener('touchcancel', () => {
        swipeTracking = false;
      }, { passive: true });

      // Local image picker fallback
      dom.fallbackUpload.addEventListener('click', (e) => {
        e.stopPropagation();
        dom.imageFileInput.click();
      });
      dom.imageFileInput.addEventListener('change', (e) => {
        loadLocalImageFiles(e.target.files);
        e.target.value = '';
      });

      // Local audio picker fallback
      dom.audioUploadBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dom.audioFileInput.click();
      });
      dom.audioFileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          loadLocalAudioFile(e.target.files[0]);
        }
        e.target.value = '';
      });

      // Audio pill controls
      dom.audioPlayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleAudioPlay();
      });
      dom.audioMuteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleAudioMute();
      });
      dom.audioVolume.addEventListener('input', (e) => {
        handleVolumeInput(e.target.value);
      });

      // Keyboard controls: Enter/Space on cover, ArrowLeft/ArrowRight to navigate, Space to toggle audio
      document.addEventListener('keydown', (e) => {
        if (e.target && e.target.tagName === 'INPUT') return;

        if (!state.entered) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            enterViewer(true);
          }
          return;
        }

        if (e.key === ' ') {
          e.preventDefault();
          toggleAudioPlay();
          return;
        }

        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          goToPage(state.currentIndex - 1);
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          goToPage(state.currentIndex + 1);
        }
      });

      initWindowDragDrop();
    }

    /* -----------------------------------------------------------------------
     * INITIALIZE
     * ----------------------------------------------------------------------- */
    window.addEventListener('DOMContentLoaded', () => {
      initAudio();
      bindEvents();
      showPage(0, true);
    });
  </script>
</body>
</html>
